<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gokhan AI</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0f172a" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column;
  }
  #login-screen {
    flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px;
  }
  #login-screen h1 { font-size: 1.4rem; margin: 0; }
  #login-screen input {
    padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; width: 260px; font-size: 1rem;
  }
  #login-screen button, .send-btn {
    padding: 12px 18px; border-radius: 10px; border: none; background: #6366f1; color: white; font-size: 1rem; cursor: pointer;
  }
  #login-error { color: #f87171; font-size: 0.9rem; min-height: 1.2em; }
  #app { display: none; flex: 1; flex-direction: column; height: 100vh; }
  header {
    padding: 14px 16px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  header button { background: none; border: 1px solid #334155; color: #94a3b8; padding: 6px 10px; border-radius: 8px; font-size: 0.85rem; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #6366f1; color: white; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 4px; }
  .msg.pending { opacity: 0.6; font-style: italic; }
  #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #1e293b; }
  #composer textarea {
    flex: 1; resize: none; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; padding: 10px 12px; font-size: 1rem; font-family: inherit; max-height: 120px;
  }
  #history-toggle { display: none; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>🤖 Gokhan AI</h1>
  <input id="password-input" type="password" placeholder="Şifre" autocomplete="current-password" />
  <button id="login-btn">Giriş Yap</button>
  <div id="login-error"></div>
</div>

<div id="app">
  <header>
    <h1>Gokhan AI</h1>
    <div>
      <button id="new-chat-btn">+ Yeni</button>
      <button id="logout-btn">Çıkış</button>
    </div>
  </header>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" placeholder="Mesajınızı yazın..." rows="1"></textarea>
    <button class="send-btn" type="submit">Gönder</button>
  </form>
</div>

<script>
  const loginScreen = document.getElementById('login-screen');
  const app = document.getElementById('app');
  const messagesEl = document.getElementById('messages');
  const composer = document.getElementById('composer');
  const input = document.getElementById('input');
  let conversationId = null;

  async function checkAuth() {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (data.authenticated) showApp(); else showLogin();
  }

  function showLogin() {
    loginScreen.style.display = 'flex';
    app.style.display = 'none';
  }

  function showApp() {
    loginScreen.style.display = 'none';
    app.style.display = 'flex';
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const password = document.getElementById('password-input').value;
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password })
    });
    if (res.ok) { showApp(); } else {
      document.getElementById('login-error').textContent = 'Şifre yanlış.';
    }
  });

  document.getElementById('password-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    location.reload();
  });

  document.getElementById('new-chat-btn').addEventListener('click', () => {
    conversationId = null;
    messagesEl.innerHTML = '';
  });

  function addMessage(role, content, pending = false) {
    const div = document.createElement('div');
    div.className = 'msg ' + role + (pending ? ' pending' : '');
    div.textContent = content;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMessage('user', text);
    const pendingEl = addMessage('assistant', 'Yazıyor...', true);
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ conversationId, message: text })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Hata oluştu.');
      conversationId = data.conversationId;
      pendingEl.textContent = data.reply;
      pendingEl.classList.remove('pending');
    } catch (err) {
      pendingEl.textContent = 'Hata: ' + err.message;
      pendingEl.classList.remove('pending');
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  checkAuth();
</script>
</body>
</html>
